name: relay-balance check

on:
  push:
    paths:
      - 'dsh-relay-balance/**'
      - '.github/workflows/relay-balance-check.yml'
  pull_request:
    paths:
      - 'dsh-relay-balance/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        working-directory: dsh-relay-balance
        run: |
          node --check index.js
          node --check client.js
      - name: Manifest check
        working-directory: dsh-relay-balance
        run: |
          node -e "const p=require('./package.json');if(!p.dsh?.bundle||!p.dsh?.client)process.exit(1)"
          node -e "for (const f of ['locale/zh.json','locale/en.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
